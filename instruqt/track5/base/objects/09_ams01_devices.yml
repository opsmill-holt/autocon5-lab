---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    # Amsterdam Site 01 — medium campus: 1 router, 1 dist switch, 2 access switches.
    # Amsterdam is a LIVE site, so each device gets a management IP from the
    # 172.16.1.0/24 prefix (created in 07c_mgmt_ipam.yml, default namespace).
    - name: AMS-RTR-01
      status: active
      role: edge
      location: ams-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.1.1/24", "default"]

    - name: AMS-DSW-01
      status: active
      role: spine
      location: ams-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.1.2/24", "default"]

    - name: AMS-ASW-01
      status: active
      role: leaf
      location: ams-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.1.3/24", "default"]

    - name: AMS-ASW-02
      status: active
      role: leaf
      location: ams-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.1.4/24", "default"]
