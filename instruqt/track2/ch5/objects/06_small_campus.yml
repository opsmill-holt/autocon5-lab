---
# Track 2 ch5: the one design the student builds BY HAND in the UI — small-campus
# plus its two device entries. The solve loads this to mirror that manual work,
# then loads ch5_remaining_designs.yml for the medium/large/dc designs.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnCampusSite
  data:
    - name: small-campus
      description: Small campus design — 1 router, 1 access switch
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: OtnDesignDeviceEntry
  data:
    - design: small-campus
      template: border-router
      count: 1
    - design: small-campus
      template: access-switch
      count: 1
