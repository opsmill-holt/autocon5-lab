---
# Munich site (muc-01) — the "new site" a student creates by hand in Track 2.
# Tracks 4 and 5 replay that result by loading this file so the generator has a
# site to provision. Europe/Germany/Munich are upserted; the muc-01 site is created.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationRegion
  data:
    - name: Europe
      children:
        kind: LocationCountry
        data:
          - name: Germany
            children:
              kind: LocationMetro
              data:
                - name: Munich
                  children:
                    kind: LocationSite
                    data:
                      - name: muc-01
                        status: active
                        timezone: Europe/Berlin
                        description: OtterNet Munich site — small campus (AutoCon 5)
