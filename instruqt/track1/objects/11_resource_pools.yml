---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: lon-mgmt-pool
      description: Management IP pool for LON site
      default_address_type: IpamIPAddress
      default_prefix_length: 32
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          - prefix: "172.16.1.0/24"
            status: active
            role: management
            description: LON site management subnet

    - name: ams-mgmt-pool
      description: Management IP pool for AMS site
      default_address_type: IpamIPAddress
      default_prefix_length: 32
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          - prefix: "172.16.2.0/24"
            status: active
            role: management
            description: AMS site management subnet

    - name: muc-mgmt-pool
      description: Management IP pool for MUC site
      default_address_type: IpamIPAddress
      default_prefix_length: 32
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          - prefix: "172.16.3.0/24"
            status: active
            role: management
            description: MUC site management subnet
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: otn-mgmt-prefix-pool
      description: Management subnet pool for OtterNet sites — allocates /24s from 172.16.0.0/16
      default_prefix_length: 24
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          - prefix: "172.16.0.0/16"
            status: active
            role: supernet
            description: OtterNet management address space
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: otn-asn-pool
      description: Private BGP ASN pool for OtterNet sites (65000-65534)
      node: LocationSite
      node_attribute: bgp_asn
      start_range: 65000
      end_range: 65534
