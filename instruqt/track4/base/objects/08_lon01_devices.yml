---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    # London Site 01 — large campus: 2 routers, 2 dist switches, 4 access switches.
    # London is a LIVE site, so each device gets a management IP from the
    # 172.16.0.0/24 prefix (created in 07c_mgmt_ipam.yml, default namespace).
    - name: LON-RTR-01
      status: active
      role: edge
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.1/24", "default"]

    - name: LON-RTR-02
      status: active
      role: edge
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.2/24", "default"]

    - name: LON-DSW-01
      status: active
      role: spine
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.3/24", "default"]

    - name: LON-DSW-02
      status: active
      role: spine
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.4/24", "default"]

    - name: LON-ASW-01
      status: active
      role: leaf
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.5/24", "default"]

    - name: LON-ASW-02
      status: active
      role: leaf
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.6/24", "default"]

    - name: LON-ASW-03
      status: active
      role: leaf
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.7/24", "default"]

    - name: LON-ASW-04
      status: active
      role: leaf
      location: lon-01
      member_of_groups:
        - device_config
      primary_address: ["172.16.0.8/24", "default"]
