---
# Management IPAM for the LIVE sites, created BEFORE the devices (08/09) so each
# device can reference its primary_address at creation time. London and
# Amsterdam each get a /24 carved from the 172.16.0.0/16 management supernet;
# every device then takes one address from its site /24. Prefixes and addresses
# live in the `default` IP namespace and auto-nest under the supernet (created in
# 10_ipam_mgmt.yml) once it is loaded. New sites (e.g. Munich) instead draw their
# /24 from otn-mgmt-prefix-pool when the generator runs in Track 4.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: "172.16.0.0/24"
      status: active
      role: management
      ip_namespace: default
      description: London (lon-01) management prefix
    - prefix: "172.16.1.0/24"
      status: active
      role: management
      ip_namespace: default
      description: Amsterdam (ams-01) management prefix

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "172.16.0.1/24"
      ip_namespace: default
    - address: "172.16.0.2/24"
      ip_namespace: default
    - address: "172.16.0.3/24"
      ip_namespace: default
    - address: "172.16.0.4/24"
      ip_namespace: default
    - address: "172.16.0.5/24"
      ip_namespace: default
    - address: "172.16.0.6/24"
      ip_namespace: default
    - address: "172.16.0.7/24"
      ip_namespace: default
    - address: "172.16.0.8/24"
      ip_namespace: default
    - address: "172.16.1.1/24"
      ip_namespace: default
    - address: "172.16.1.2/24"
      ip_namespace: default
    - address: "172.16.1.3/24"
      ip_namespace: default
    - address: "172.16.1.4/24"
      ip_namespace: default
