query CampusSite($name: String!) {
  LocationSite(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        mgmt_prefix {
          node {
            id
          }
        }
        design {
          node {
            ... on OtnCampusSite {
              device_entries {
                edges {
                  node {
                    count {
                      value
                    }
                    device_hostname_prefix {
                      value
                    }
                    template {
                      node {
                        id
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
