# management prefix 172.16.1.0/24 (07c_mgmt_ipam.yml). Loads before
# 14_ams01_router.yml, which points at it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: "172.16.1.5/24"
      ip_namespace: default
