---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

generics:
  - name: SiteDesign
    namespace: Otn
    description: Abstract site design blueprint shared by campus and DC tiers.
    label: Site Design
    icon: mdi:file-tree
    include_in_menu: true
    human_friendly_id:
      - name__value
    display_label: name__value
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: router_count
        kind: Number
        default_value: 1
        order_weight: 1200
      - name: bgp_asn
        kind: Number
        optional: true
        order_weight: 1300
    relationships:
      - name: device_entries
        peer: OtnDesignDeviceEntry
        kind: Component
        cardinality: many
        optional: true
        on_delete: cascade
        identifier: design__device_entries
        order_weight: 2000

nodes:
  - name: DesignDeviceEntry
    namespace: Otn
    label: Design Device Entry
    description: Links a site design to a device template with a desired instance count.
    icon: mdi:counter
    include_in_menu: false
    human_friendly_id:
      - design__name__value
      - template__template_name__value
    order_by:
      - template__template_name__value
    attributes:
      - name: count
        kind: Number
        default_value: 1
        order_weight: 1000
    relationships:
      - name: design
        peer: OtnSiteDesign
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: design__device_entries
        order_weight: 2000
      - name: template
        peer: TemplateDcimDevice
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: device_template__entries
        order_weight: 2100

  - name: CampusSite
    namespace: Otn
    label: Campus Site Design
    icon: ri:building-line
    inherit_from:
      - OtnSiteDesign
      - CoreArtifactTarget
    menu_placement: OtnSiteDesign
    uniqueness_constraints:
      - [name__value]
    human_friendly_id:
      - name__value
    display_label: name__value
    attributes:
      - name: access_switch_count
        kind: Number
        default_value: 1
        order_weight: 1500
      - name: distribution_switch_count
        kind: Number
        default_value: 0
        order_weight: 1600

  - name: DataCenterSite
    namespace: Otn
    label: Data Center Site Design
    icon: mdi:server-network
    inherit_from:
      - OtnSiteDesign
      - CoreArtifactTarget
    menu_placement: OtnSiteDesign
    uniqueness_constraints:
      - [name__value]
    human_friendly_id:
      - name__value
    display_label: name__value
    attributes:
      - name: spine_count
        kind: Number
        default_value: 2
        order_weight: 1500
      - name: leaf_count
        kind: Number
        default_value: 4
        order_weight: 1600
      - name: border_leaf_count
        kind: Number
        default_value: 2
        order_weight: 1700

extensions:
  nodes:
    - kind: LocationSite
      relationships:
        - name: design
          label: Site Design
          peer: OtnSiteDesign
          cardinality: one
          kind: Attribute
          optional: true
          identifier: location_site__design
          order_weight: 2000
